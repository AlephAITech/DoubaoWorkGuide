<!doctype html>

    <title>豆包工作蓝皮书</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("doubao-guide-theme");
          document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260901-14" />
    <script src="/app.js?v=20260901-14" defer></script>

        <a href="#/reading-guide" data-nav="guide">阅读指南</a>
        <div class="community-nav">
          <button class="community-trigger" type="button" aria-expanded="false" aria-controls="community-popover">
            交流群
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg>
          </button>
          <section class="community-popover" id="community-popover" aria-label="豆包工作交流群" hidden>

            <div class="community-qr-placeholder" role="img" aria-label="豆包工作交流群二维码待配置">

              <strong>二维码待配置</strong>

            </div>
            <div class="community-caption"><span>WECHAT GROUP</span><strong>微信扫码加入交流群</strong></div>

        </div>
        <a class="mobile-github-nav" href="https://github.com/AlephAITech/DoubaoWorkGuide" target="_blank" rel="noreferrer" aria-label="打开 GitHub 仓库">

      <div class="header-actions">
        <button class="icon-button search-trigger" type="button" aria-label="搜索指南" title="搜索指南（⌘K）">

        <a class="github-link icon-button" href="https://github.com/AlephAITech/DoubaoWorkGuide" target="_blank" rel="noreferrer" aria-label="打开 GitHub 仓库" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.4 4 5 5 0 0 0 19.3.5S18.2.1 15 1.8a13.4 13.4 0 0 0-7 0C4.8.1 3.7.5 3.7.5A5 5 0 0 0 3.6 4a5.4 5.4 0 0 0-1.4 3.5c0 5.4 3.5 6.6 6.8 7A4.8 4.8 0 0 0 8 18v4M8 19c-3 .9-3-1.5-4-2"/></svg>

        <button class="icon-button nav-toggle" type="button" aria-label="打开主导航" aria-controls="primary-navigation" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="icon-button menu-toggle" type="button" aria-label="打开章节目录" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>

    <div class="sidebar-scrim" hidden></div>

    <dialog class="search-dialog" aria-labelledby="search-title">
      <div class="search-shell">
        <div class="search-head">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <label class="sr-only" for="search-input" id="search-title">搜索全部章节</label>
          <input id="search-input" type="search" placeholder="搜索任务、工具或场景…" autocomplete="off" />
          <button class="search-close" type="button" aria-label="关闭搜索">ESC</button>
        </div>
        <div class="search-hint"><span>全文搜索</span><span>↑↓ 选择 · Enter 打开</span></div>
        <div class="search-results" role="listbox" aria-label="搜索结果"></div>
      </div>
    </dialog>

    <dialog class="image-dialog" aria-label="查看大图">
      <button class="image-close" type="button" aria-label="关闭大图">×</button>
      <figure><img alt="" /><figcaption></figcaption></figure>
